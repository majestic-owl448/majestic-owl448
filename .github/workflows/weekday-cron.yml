name: Weekday cron workflow

on:
  schedule:
    - cron: '0 7 * * 1-5'
      timezone: 'Europe/Rome'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  create-triggered-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create issues for merged dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          issue_exists() {
            local title="$1"
            local matches
            matches=$(TITLE="$title" gh api -X GET search/issues \
              -f q="repo:${REPOSITORY} is:issue in:title \"${title}\"" \
              --jq '[.items[] | select(.title == env.TITLE)] | length')
            [ "$matches" -gt 0 ]
          }

          ensure_issue() {
            local title="$1"
            local body="$2"

            if issue_exists "$title"; then
              echo "An issue titled '$title' already exists."
              return 0
            fi

            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          }

          if [ "$(gh pr view 66731 --repo freeCodeCamp/freeCodeCamp --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'Unblock `freeCodeCamp/freeCodeCamp#68228` and add help wanted' \
              $'`https://github.com/freeCodeCamp/freeCodeCamp/pull/66731` has merged.\n\nUnblock `https://github.com/freeCodeCamp/freeCodeCamp/issues/68228` and add the `help wanted` label.'
            ensure_issue \
              'Remove the `freeCodeCamp/freeCodeCamp#66731` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove the `https://github.com/freeCodeCamp/freeCodeCamp/pull/66731` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 594 --repo freeCodeCamp/curriculum-helpers --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'Unblock freeCodeCamp issues after `freeCodeCamp/curriculum-helpers#594`' \
              $'`https://github.com/freeCodeCamp/curriculum-helpers/pull/594` has merged.\n\nUnblock these items:\n\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/69421`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68818`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68805`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68720`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68712`\n- `https://github.com/freeCodeCamp/freeCodeCamp/pull/69202`'
            ensure_issue \
              'Remove the `freeCodeCamp/curriculum-helpers#594` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove the `https://github.com/freeCodeCamp/curriculum-helpers/pull/594` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 69777 --repo freeCodeCamp/freeCodeCamp --json state,mergedAt --jq '.mergedAt != null or .state == "CLOSED"')" = "true" ]; then
            ensure_issue \
              'Continue work on Digital Pet lab' \
              'continue working on `https://github.com/freeCodeCamp/freeCodeCamp/pull/69782`'
            ensure_issue \
              'Remove the `freeCodeCamp/freeCodeCamp#69777` check from the weekday cron workflow' \
              'The dependency PR has been merged or closed. Remove the `https://github.com/freeCodeCamp/freeCodeCamp/pull/69777` check from `.github/workflows/weekday-cron.yml`.'
          fi

          # Merge commit for freeCodeCamp/freeCodeCamp#69580.
          merge_sha=0a1529a77005aec434b120739175eb75d0211380
          comparison=$(gh api "repos/freeCodeCamp/freeCodeCamp/compare/${merge_sha}...prod-current" --jq '.status')
          if [ "$comparison" = "ahead" ] || [ "$comparison" = "identical" ]; then
            ensure_issue \
              'Continue `freeCodeCamp/cdn#404` after dependency reaches prod-current' \
              $'The merge commit for `https://github.com/freeCodeCamp/freeCodeCamp/pull/69580` is now in `prod-current`.\n\nContinue work on `https://github.com/freeCodeCamp/cdn/pull/404`; its dependency has reached `prod-current`.'
            ensure_issue \
              'Remove the `freeCodeCamp/freeCodeCamp#69580` prod-current check' \
              'The merge commit for `https://github.com/freeCodeCamp/freeCodeCamp/pull/69580` is now in `prod-current`. Remove only its pinned merge SHA and `prod-current` comparison block from `.github/workflows/weekday-cron.yml`.'
          fi

          for pr_number in 229 268 559 563 565 569 577 594 595 600 601 604; do
            pr_state=$(gh pr view "$pr_number" --repo freeCodeCamp/curriculum-helpers --json state --jq '.state')
            pr_url="https://github.com/freeCodeCamp/curriculum-helpers/pull/${pr_number}"

            if [ "$pr_state" = "MERGED" ]; then
              printf -v documentation_body '`%s` has merged.\n\nUpdate `src/content/docs/curriculum-help.mdx` in `freeCodeCamp/contribute` to document the changes from this PR.' "$pr_url"
              ensure_issue \
                "Update curriculum helper documentation after \`freeCodeCamp/curriculum-helpers#${pr_number}\`" \
                "$documentation_body"
            fi

            if [ "$pr_state" = "MERGED" ] || [ "$pr_state" = "CLOSED" ]; then
              printf -v cleanup_body '`%s` has merged or closed without merging.\n\nRemove only `%s` from the curriculum helper documentation loop in `.github/workflows/weekday-cron.yml`. Preserve the other PR numbers and any separate checks for this PR. If no PR numbers remain, remove the documentation loop.' "$pr_url" "$pr_number"
              ensure_issue \
                "Remove the \`freeCodeCamp/curriculum-helpers#${pr_number}\` documentation check from the weekday cron workflow" \
                "$cleanup_body"
            fi
          done
