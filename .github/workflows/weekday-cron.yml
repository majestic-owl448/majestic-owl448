name: Weekday cron workflow

on:
  schedule:
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

jobs:
  create-triggered-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create issues for merged dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          issue_exists() {
            local title="$1"
            local matches
            matches=$(TITLE="$title" gh api -X GET search/issues \
              -f q="repo:${REPOSITORY} is:issue in:title \"${title}\"" \
              --jq '[.items[] | select(.title == env.TITLE)] | length')
            [ "$matches" -gt 0 ]
          }

          ensure_issue() {
            local title="$1"
            local body="$2"

            if issue_exists "$title"; then
              echo "An issue titled '$title' already exists."
              return 0
            fi

            gh issue create --repo "$REPOSITORY" --title "$title" --body "$body"
          }

          if [ "$(gh pr view 66731 --repo freeCodeCamp/freeCodeCamp --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'Unblock `freeCodeCamp/freeCodeCamp#68228` and add help wanted' \
              $'`https://github.com/freeCodeCamp/freeCodeCamp/pull/66731` has merged.\n\nUnblock `https://github.com/freeCodeCamp/freeCodeCamp/issues/68228` and add the `help wanted` label.'
            ensure_issue \
              'Remove the `freeCodeCamp/freeCodeCamp#66731` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove the `https://github.com/freeCodeCamp/freeCodeCamp/pull/66731` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 594 --repo freeCodeCamp/curriculum-helpers --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'Unblock freeCodeCamp issues after `freeCodeCamp/curriculum-helpers#594`' \
              $'`https://github.com/freeCodeCamp/curriculum-helpers/pull/594` has merged.\n\nUnblock these items:\n\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/69421`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68818`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68805`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68720`\n- `https://github.com/freeCodeCamp/freeCodeCamp/issues/68712`\n- `https://github.com/freeCodeCamp/freeCodeCamp/pull/69202`'
            ensure_issue \
              'Remove the `freeCodeCamp/curriculum-helpers#594` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove the `https://github.com/freeCodeCamp/curriculum-helpers/pull/594` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 69777 --repo freeCodeCamp/freeCodeCamp --json state,mergedAt --jq '.mergedAt != null or .state == "CLOSED"')" = "true" ]; then
            ensure_issue \
              'Continue work on Digital Pet lab' \
              'continue working on `https://github.com/freeCodeCamp/freeCodeCamp/pull/69782`'
            ensure_issue \
              'Remove the `freeCodeCamp/freeCodeCamp#69777` check from the weekday cron workflow' \
              'The dependency PR has been merged or closed. Remove the `https://github.com/freeCodeCamp/freeCodeCamp/pull/69777` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 69580 --repo freeCodeCamp/freeCodeCamp --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'continue working on `freeCodeCamp/cdn#404`' \
              'Keep an eye on deployments, when `https://github.com/freeCodeCamp/freeCodeCamp/pull/69580` is also deployed, `https://github.com/freeCodeCamp/cdn/pull/404` can be merged'
            ensure_issue \
              'Remove the `freeCodeCamp/freeCodeCamp#69580` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/freeCodeCamp/pull/69580` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 405 --repo freeCodeCamp/cdn --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'unlock `freeCodeCamp/freeCodeCamp#70107`' \
              'unlock `https://github.com/freeCodeCamp/freeCodeCamp/issues/70107`'
            ensure_issue \
              'Remove the `freeCodeCamp/cdn#405` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/cdn/pull/405` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 406 --repo freeCodeCamp/cdn --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'unlock `freeCodeCamp/freeCodeCamp#70113`' \
              'unlock `https://github.com/freeCodeCamp/freeCodeCamp/issues/70113`'
            ensure_issue \
              'Remove the `freeCodeCamp/cdn#406` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/cdn/pull/406` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 407 --repo freeCodeCamp/cdn --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'unlock `freeCodeCamp/freeCodeCamp#70114`' \
              'unlock `https://github.com/freeCodeCamp/freeCodeCamp/issues/70114`'
            ensure_issue \
              'Remove the `freeCodeCamp/cdn#407` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/cdn/pull/407` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 408 --repo freeCodeCamp/cdn --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'unlock `freeCodeCamp/freeCodeCamp#70115`' \
              'unlock `https://github.com/freeCodeCamp/freeCodeCamp/issues/70115`'
            ensure_issue \
              'Remove the `freeCodeCamp/cdn#408` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/cdn/pull/408` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 409 --repo freeCodeCamp/cdn --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'unlock `freeCodeCamp/freeCodeCamp#70116`' \
              'unlock `https://github.com/freeCodeCamp/freeCodeCamp/issues/70116`'
            ensure_issue \
              'Remove the `freeCodeCamp/cdn#409` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/cdn/pull/409` check from `.github/workflows/weekday-cron.yml`.'
          fi

          if [ "$(gh pr view 410 --repo freeCodeCamp/cdn --json mergedAt --jq '.mergedAt != null')" = "true" ]; then
            ensure_issue \
              'unlock `freeCodeCamp/freeCodeCamp#70117`' \
              'unlock `https://github.com/freeCodeCamp/freeCodeCamp/issues/70117`'
            ensure_issue \
              'Remove the `freeCodeCamp/cdn#410` check from the weekday cron workflow' \
              'The dependency PR has merged. Remove only the `https://github.com/freeCodeCamp/cdn/pull/410` check from `.github/workflows/weekday-cron.yml`.'
          fi

          for pr_number in 229 268 559 563 565 569 577 594 595 600 601 603 604; do
            pr_state=$(gh pr view "$pr_number" --repo freeCodeCamp/curriculum-helpers --json state --jq '.state')
            pr_url="https://github.com/freeCodeCamp/curriculum-helpers/pull/${pr_number}"

            if [ "$pr_state" = "MERGED" ]; then
              contribute_state=$(gh pr view 1518 --repo freeCodeCamp/contribute --json state --jq '.state')
              if [ "$contribute_state" = "OPEN" ]; then
                printf -v documentation_body '`%s` has merged.\n\nUpdate `https://github.com/freeCodeCamp/contribute/pull/1518` to document the changes from this PR.' "$pr_url"
              else
                printf -v documentation_body '`%s` has merged.\n\nUpdate `src/content/docs/curriculum-help.mdx` in `freeCodeCamp/contribute` directly to document the changes from this PR. `https://github.com/freeCodeCamp/contribute/pull/1518` is no longer open.' "$pr_url"
              fi
              ensure_issue \
                "Update curriculum helper documentation after \`freeCodeCamp/curriculum-helpers#${pr_number}\`" \
                "$documentation_body"
            fi

            if [ "$pr_state" = "MERGED" ] || [ "$pr_state" = "CLOSED" ]; then
              printf -v cleanup_body '`%s` has merged or closed without merging.\n\nRemove only `%s` from the curriculum helper documentation loop in `.github/workflows/weekday-cron.yml`. Preserve the other PR numbers and any separate checks for this PR. If no PR numbers remain, remove the documentation loop.' "$pr_url" "$pr_number"
              ensure_issue \
                "Remove the \`freeCodeCamp/curriculum-helpers#${pr_number}\` documentation check from the weekday cron workflow" \
                "$cleanup_body"
            fi
          done
