name: Add weekday cron trigger
description: Request an issue to be created when a condition is met.
title: "Add weekday cron trigger: "
body:
  - type: markdown
    attributes:
      value: |
        For external issues and pull requests, use full URLs in backticks in the
        trigger, issue body, and notes so they can be copied directly. In the
        requested issue title, use backticked `owner/repo#123` references.
        Links to issues and pull requests in this repository are allowed.
  - type: textarea
    id: trigger
    attributes:
      label: Trigger
      description: Describe the condition that should cause the workflow to create an issue.
    validations:
      required: true
  - type: input
    id: issue-title
    attributes:
      label: Issue title
      description: Provide the title of the issue the workflow should create. Put external issue and PR references in backticks using the owner/repo#123 format.
    validations:
      required: true
  - type: textarea
    id: issue-body
    attributes:
      label: Issue body
      description: Provide the body of the issue the workflow should create. Put full external issue and PR URLs in backticks.
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: Add any optional context for the workflow change.
  - type: textarea
    id: cron-workflow-format
    attributes:
      label: Cron workflow format
      description: Keep this format in the submitted issue so the workflow change is specified.
      value: |
        Add a conditional block to `.github/workflows/weekday-cron.yml`.
        When the trigger is met, call `ensure_issue` for the requested issue first.
        Then call `ensure_issue` for a cleanup issue that removes only that new trigger check.

        When creating or modifying the workflow, apply these rules to both generated issues:
        - In titles, put external issue and PR references in backticks using `owner/repo#123`.
        - In bodies, put full external issue and PR URLs in backticks, preserving any comment or review fragment.
        - Links to issues and PRs in this repository are allowed.

        ```bash
        if trigger_is_met; then
          ensure_issue \
            '<issue title>' \
            '<issue body>'
          ensure_issue \
            'Remove the <trigger name> check from the weekday cron workflow' \
            'The trigger has been satisfied. Remove only the `<trigger check>` from `.github/workflows/weekday-cron.yml`.'
        fi
        ```
    validations:
      required: true
